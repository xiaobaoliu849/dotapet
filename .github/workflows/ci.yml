name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Smoke runs keep their data (and a failure screenshot) in the temp folder uploaded below.
      - run: npm run smoke
        env: { TEMP: '${{ runner.temp }}', TMP: '${{ runner.temp }}' }
      - name: Every settings page translated (English, Russian, Ukrainian)
        env: { TEMP: '${{ runner.temp }}', TMP: '${{ runner.temp }}' }
        # bash stops at the first failing language; PowerShell would only report the last.
        shell: bash
        run: |
          npm run smoke -- --lang=en
          npm run smoke -- --lang=ru
          npm run smoke -- --lang=uk
      - name: Save failed desktop screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure
          path: ${{ runner.temp }}/companion-smoke-*/smoke-failure.png
          if-no-files-found: ignore

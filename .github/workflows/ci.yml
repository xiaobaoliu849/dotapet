name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - name: Save failed desktop screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure
          path: ${{ runner.temp }}/companion-smoke-*/smoke-failure.png
          if-no-files-found: ignore

name: Windows experience release
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm test
      - run: npm run smoke
        env: { TEMP: '${{ runner.temp }}', TMP: '${{ runner.temp }}' }
      - name: Every settings page translated (English, Russian, Ukrainian)
        env: { TEMP: '${{ runner.temp }}', TMP: '${{ runner.temp }}' }
        shell: bash
        run: |
          npm run smoke -- --lang=en
          npm run smoke -- --lang=ru
          npm run smoke -- --lang=uk
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke-desktop.mjs release/win-unpacked/DotaPet.exe
        env: { TEMP: '${{ runner.temp }}', TMP: '${{ runner.temp }}' }
      - name: Verify update download and corrupt-package rejection without installing
        run: npm run test:update-download
      - name: Installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $file = "DotaPet-Setup-$version.exe"
          if (!(Test-Path release/latest.yml)) { throw 'Missing updater metadata' }
          if (!(Test-Path "release/$file.blockmap")) { throw 'Missing updater blockmap' }
          $hash = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: DotaPet-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
      - name: Save failed desktop screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-failure
          path: ${{ runner.temp }}/companion-smoke-*/smoke-failure.png
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: false
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

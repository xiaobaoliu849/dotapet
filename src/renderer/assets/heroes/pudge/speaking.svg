<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="pudgeSkin" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="60%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </radialGradient>
    <radialGradient id="rotGas" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
  </defs>

  <!-- Toxic Rot Gas Clouds -->
  <circle cx="35" cy="145" r="26" fill="url(#rotGas)" opacity="0.5"/>
  <circle cx="170" cy="150" r="28" fill="url(#rotGas)" opacity="0.5"/>
  <circle cx="155" cy="75" r="18" fill="url(#rotGas)" opacity="0.4"/>

  <!-- Body -->
  <path d="M40 180 C 35 120, 60 110, 100 110 C 140 110, 165 120, 160 180 Z" fill="#78350f"/>
  <path d="M60 120 L 140 120 L 130 180 L 70 180 Z" fill="#d97706"/>

  <!-- Meat Cleaver & Hook -->
  <rect x="20" y="115" width="18" height="38" fill="#94a3b8" rx="2" transform="rotate(-30 20 115)"/>
  <path d="M150 105 Q 180 110 175 135 Q 170 155 145 145" stroke="#cbd5e1" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Big Round Head -->
  <ellipse cx="100" cy="85" rx="42" ry="42" fill="url(#pudgeSkin)"/>

  <!-- Stitches on Head -->
  <path d="M75 55 Q 95 65 120 58" stroke="#1c1917" stroke-width="2.5" fill="none"/>
  <line x1="82" y1="52" x2="82" y2="60" stroke="#1c1917" stroke-width="2"/>
  <line x1="95" y1="56" x2="95" y2="64" stroke="#1c1917" stroke-width="2"/>
  <line x1="110" y1="55" x2="110" y2="63" stroke="#1c1917" stroke-width="2"/>

  <!-- Eyes Speaking / Excited -->
  <circle cx="80" cy="78" r="11" fill="#ffffff"/>
  <circle cx="80" cy="78" r="6" fill="#ef4444"/>
  <circle cx="82" cy="76" r="2" fill="#ffffff"/>
  <circle cx="120" cy="76" r="9" fill="#ffffff"/>
  <circle cx="120" cy="76" r="5" fill="#ef4444"/>
  <circle cx="122" cy="74" r="2" fill="#ffffff"/>

  <!-- Giant Wide Open Mouth Speaking "Fresh Meat!" -->
  <ellipse cx="100" cy="106" rx="28" ry="16" fill="#450a0a"/>
  <!-- Sharp Teeth -->
  <polygon points="76,96 82,96 79,104" fill="#ffffff"/>
  <polygon points="88,94 94,94 91,104" fill="#ffffff"/>
  <polygon points="106,94 112,94 109,104" fill="#ffffff"/>
  <polygon points="118,96 124,96 121,104" fill="#ffffff"/>
  <polygon points="84,116 90,116 87,108" fill="#ffffff"/>
  <polygon points="110,116 116,116 113,108" fill="#ffffff"/>
  <!-- Big Red Tongue -->
  <ellipse cx="100" cy="114" rx="14" ry="7" fill="#dc2626"/>
</svg>

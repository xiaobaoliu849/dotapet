<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="cmCape" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="cmHair" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <filter id="frostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ice Flakes Idle -->
  <polygon points="45,45 48,52 55,55 48,58 45,65 42,58 35,55 42,52" fill="#bae6fd" filter="url(#frostGlow)"/>
  <polygon points="155,50 157,55 162,57 157,59 155,64 153,59 148,57 153,55" fill="#bae6fd" filter="url(#frostGlow)"/>

  <!-- Fur Cape Hood -->
  <path d="M45 180 C 35 120, 55 90, 100 90 C 145 90, 165 120, 155 180 Z" fill="url(#cmCape)"/>
  <!-- White Fur Trim -->
  <path d="M50 100 Q 100 80 150 100 Q 100 115 50 100 Z" fill="#f8fafc"/>

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="34" ry="38" fill="#ffedd5"/>

  <!-- Gentle Blue Eyes (Idle) -->
  <ellipse cx="86" cy="95" rx="6" ry="4.5" fill="#ffffff"/>
  <circle cx="86" cy="95" r="3" fill="#0284c7"/>
  <circle cx="87" cy="93.5" r="1.2" fill="#ffffff"/>
  <ellipse cx="114" cy="95" rx="6" ry="4.5" fill="#ffffff"/>
  <circle cx="114" cy="95" r="3" fill="#0284c7"/>
  <circle cx="115" cy="93.5" r="1.2" fill="#ffffff"/>

  <!-- Soft Eyebrows -->
  <path d="M78 88 Q 86 85 94 88" stroke="#ca8a04" stroke-width="2.5" fill="none"/>
  <path d="M106 88 Q 114 85 122 88" stroke="#ca8a04" stroke-width="2.5" fill="none"/>

  <!-- Gentle Smile -->
  <path d="M93 115 Q 100 120 107 115" stroke="#e11d48" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Blonde Braids & Hair -->
  <path d="M60 85 C 60 45, 140 45, 140 85 C 145 105, 150 135, 142 165 C 136 135, 130 95, 120 75 C 100 65, 80 75, 60 85 Z" fill="url(#cmHair)"/>
  <path d="M60 85 C 55 105, 50 135, 58 165 C 64 135, 70 95, 80 75" fill="url(#cmHair)"/>
</svg>

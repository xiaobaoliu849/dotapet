<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="lagunaBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="lagunaGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Laguna Blade Lightning Bolt -->
  <polygon points="100,5 125,70 105,75 135,140 85,85 105,80" fill="url(#lagunaBeam)" filter="url(#lagunaGlow)"/>

  <!-- Flaming Hair (Action Blazing) -->
  <path d="M25 70 C 5 110, 15 155, 40 180 C 25 135, 35 95, 50 70 Z" fill="#ef4444"/>
  <path d="M175 70 C 195 110, 185 155, 160 180 C 175 135, 165 95, 150 70 Z" fill="#ef4444"/>

  <!-- Corset Dress -->
  <path d="M55 180 L 70 125 L 130 125 L 145 180 Z" fill="#991b1b"/>

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="34" ry="36" fill="#ffedd5"/>

  <!-- Eyes Blazing with Fire -->
  <circle cx="86" cy="82" r="6" fill="#facc15"/>
  <circle cx="86" cy="82" r="3" fill="#ea580c"/>
  <circle cx="114" cy="82" r="6" fill="#facc15"/>
  <circle cx="114" cy="82" r="3" fill="#ea580c"/>

  <!-- Fierce Eyebrows -->
  <line x1="78" y1="74" x2="94" y2="80" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="122" y1="74" x2="106" y2="80" stroke="#7c2d12" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Shouting Mouth -->
  <path d="M92 100 Q 100 115 108 100 Z" fill="#450a0a"/>
</svg>

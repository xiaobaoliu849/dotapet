<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="linaHair" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="flameAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
  </defs>

  <!-- Flame particles idle -->
  <circle cx="45" cy="140" r="8" fill="#fb923c" opacity="0.6"/>
  <circle cx="155" cy="130" r="10" fill="#f87171" opacity="0.6"/>

  <!-- Flowing Fiery Hair (Back) -->
  <path d="M40 80 C 20 120, 30 160, 50 180 C 40 140, 50 100, 60 80 Z" fill="url(#linaHair)"/>
  <path d="M160 80 C 180 120, 170 160, 150 180 C 160 140, 150 100, 140 80 Z" fill="url(#linaHair)"/>

  <!-- Fiery Corset Dress -->
  <path d="M55 180 L 70 125 L 130 125 L 145 180 Z" fill="#b91c1c"/>
  <polygon points="100,120 85,150 115,150" fill="#f59e0b"/>

  <!-- Head -->
  <ellipse cx="100" cy="90" rx="34" ry="38" fill="#ffedd5"/>

  <!-- Sassy Anime Eyes (Idle) -->
  <ellipse cx="86" cy="90" rx="6" ry="4.5" fill="#ffffff"/>
  <circle cx="87" cy="90" r="3" fill="#ea580c"/>
  <circle cx="88" cy="88.5" r="1.2" fill="#ffffff"/>
  <ellipse cx="114" cy="90" rx="6" ry="4.5" fill="#ffffff"/>
  <circle cx="113" cy="90" r="3" fill="#ea580c"/>
  <circle cx="114" cy="88.5" r="1.2" fill="#ffffff"/>

  <!-- Eyelashes & Brows -->
  <path d="M78 84 Q 88 80 94 84" stroke="#7c2d12" stroke-width="2.5" fill="none"/>
  <path d="M106 84 Q 112 80 122 84" stroke="#7c2d12" stroke-width="2.5" fill="none"/>

  <!-- Confident Smile -->
  <path d="M94 110 Q 100 115 107 109" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Fiery Hair Front/Bangs -->
  <path d="M60 75 C 60 40, 140 40, 140 75 C 130 65, 115 80, 100 68 C 85 80, 70 65, 60 75 Z" fill="url(#linaHair)"/>
</svg>

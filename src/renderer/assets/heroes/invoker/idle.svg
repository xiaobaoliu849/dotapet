<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="invokerCape" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="invokerHair" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="glowQuas" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowWex" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowExort" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbs -->
  <circle cx="45" cy="55" r="14" fill="#38bdf8" filter="url(#glowQuas)"/>
  <circle cx="42" cy="52" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="30" r="14" fill="#c084fc" filter="url(#glowWex)"/>
  <circle cx="97" cy="27" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="155" cy="55" r="14" fill="#fb923c" filter="url(#glowExort)"/>
  <circle cx="152" cy="52" r="4" fill="#ffffff" opacity="0.8"/>

  <!-- Cape -->
  <path d="M40 180 C 40 120, 60 100, 100 100 C 140 100, 160 120, 160 180 Z" fill="url(#invokerCape)"/>
  <path d="M50 180 L 100 120 L 150 180 Z" fill="#b91c1c"/>
  <path d="M70 125 L 100 155 L 130 125" stroke="#facc15" stroke-width="4" fill="none"/>

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="36" ry="40" fill="#fed7aa"/>

  <!-- Eyes Idle -->
  <ellipse cx="85" cy="95" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="86" cy="95" r="3" fill="#0284c7"/>
  <ellipse cx="115" cy="95" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="114" cy="95" r="3" fill="#0284c7"/>

  <!-- Eyebrows -->
  <path d="M78 88 Q 86 85 94 88" stroke="#854d0e" stroke-width="2.5" fill="none"/>
  <path d="M106 88 Q 114 85 122 88" stroke="#854d0e" stroke-width="2.5" fill="none"/>

  <!-- Mouth Idle -->
  <path d="M92 114 Q 100 119 108 114" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Elven Ears & Hair -->
  <polygon points="58,92 48,84 62,100" fill="#fed7aa"/>
  <polygon points="142,92 152,84 138,100" fill="#fed7aa"/>
  <path d="M60 85 C 60 45, 140 45, 140 85 C 145 95, 148 115, 142 135 C 136 115, 130 90, 120 75 C 100 65, 80 75, 60 85 Z" fill="url(#invokerHair)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sunstrike" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <filter id="spellBurst" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sunstrike / Spell Casting Aura -->
  <circle cx="100" cy="100" r="85" fill="url(#sunstrike)" opacity="0.25" filter="url(#spellBurst)"/>
  
  <!-- Circling Runes -->
  <circle cx="35" cy="40" r="16" fill="#38bdf8" filter="url(#spellBurst)"/>
  <circle cx="100" cy="15" r="18" fill="#c084fc" filter="url(#spellBurst)"/>
  <circle cx="165" cy="40" r="16" fill="#fb923c" filter="url(#spellBurst)"/>

  <!-- Body Casting Pose -->
  <path d="M30 180 C 30 110, 55 90, 100 90 C 145 90, 170 110, 170 180 Z" fill="#991b1b"/>
  <path d="M45 180 L 100 115 L 155 180 Z" fill="#b91c1c"/>

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="36" ry="38" fill="#fed7aa"/>

  <!-- Eyes Casting (Glowing Golden) -->
  <ellipse cx="85" cy="83" rx="7" ry="5" fill="#fef08a"/>
  <circle cx="85" cy="83" r="3" fill="#ca8a04"/>
  <ellipse cx="115" cy="83" rx="7" ry="5" fill="#fef08a"/>
  <circle cx="115" cy="83" r="3" fill="#ca8a04"/>

  <!-- Eyebrows Determined -->
  <path d="M75 75 L 95 80" stroke="#854d0e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M125 75 L 105 80" stroke="#854d0e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Smirk -->
  <path d="M92 104 Q 100 110 108 102" stroke="#9a3412" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Dynamic Hair Flare -->
  <path d="M50 75 C 50 30, 150 30, 150 75 C 160 90, 165 115, 155 140 C 145 115, 138 85, 125 70 C 100 55, 75 70, 50 75 Z" fill="#facc15"/>
</svg>

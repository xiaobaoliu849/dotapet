<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="roshanLava" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <radialGradient id="aegisGold" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <filter id="lavaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  

  <!-- Rocky Mini Wings -->
  <path d="M55 105 C20 85, 30 55, 60 75 Z" fill="#78350f" stroke="#ea580c" stroke-width="1.5"/>
  <path d="M145 105 C180 85, 170 55, 140 75 Z" fill="#78350f" stroke="#ea580c" stroke-width="1.5"/>

  <!-- Bulky Rocky Roshan Body -->
  <ellipse cx="100" cy="132" rx="42" ry="34" fill="url(#roshanLava)"/>
  <!-- Magma Core Belly -->
  <ellipse cx="100" cy="138" rx="24" ry="18" fill="#fbbf24" opacity="0.8" filter="url(#lavaGlow)"/>

  <!-- Sturdy Claw Feet -->
  <ellipse cx="74" cy="162" rx="14" ry="10" fill="#431407" transform="none"/>
  <ellipse cx="126" cy="162" rx="14" ry="10" fill="#431407" transform="none"/>

  <!-- Mighty Horns -->
  <path d="M68 62 C40 25, 25 45, 52 68 Z" fill="#451a03" stroke="#f97316" stroke-width="2" filter="url(#lavaGlow)"/>
  <path d="M132 62 C160 25, 175 45, 148 68 Z" fill="#451a03" stroke="#f97316" stroke-width="2" filter="url(#lavaGlow)"/>

  <!-- Roshan Head -->
  <ellipse cx="100" cy="85" rx="36" ry="30" fill="url(#roshanLava)"/>

  <!-- Glowing Fiery Red Eyes -->
  <ellipse cx="82" cy="78" rx="7" ry="6" fill="#fef08a" filter="url(#lavaGlow)"/>
  <circle cx="83" cy="78" r="3.5" fill="#dc2626"/>

  <ellipse cx="118" cy="78" rx="7" ry="6" fill="#fef08a" filter="url(#lavaGlow)"/>
  <circle cx="117" cy="78" r="3.5" fill="#dc2626"/>

  <!-- Baby Roar Snout & Fangs -->
  <ellipse cx="100" cy="95" rx="18" ry="12" fill="#292524"/>
  <polygon points="90,95 93,103 96,95" fill="#ffffff"/>
  <polygon points="104,95 107,103 110,95" fill="#ffffff"/>

  

  

  
  <rect x="92" y="98" width="16" height="18" rx="4" fill="#ea580c" filter="url(#lavaGlow)"/>
  

  
</svg>
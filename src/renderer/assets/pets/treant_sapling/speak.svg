<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="treantBark" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="75%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="leafGreen" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </radialGradient>
    <radialGradient id="flowerPink" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <filter id="natureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  

  <!-- Root Feet -->
  <path d="M70 155 Q60 180 45 178 Q75 168 85 155 Z" fill="#14532d"/>
  <path d="M125 155 Q140 180 155 178 Q130 168 115 155 Z" fill="#14532d"/>

  <!-- Treant Sapling Body -->
  <ellipse cx="100" cy="130" rx="36" ry="32" fill="url(#treantBark)"/>
  <!-- Moss Belly -->
  <ellipse cx="100" cy="136" rx="22" ry="18" fill="#86efac" opacity="0.6"/>

  <!-- Branch Arms -->
  <path d="M68 120 C45 110, 35 125, 40 138 C50 135, 60 128, 68 125 Z" fill="#166534" transform="none"/>
  <path d="M132 120 C155 110, 165 125, 160 138 C150 135, 140 128, 132 125 Z" fill="#166534" transform="none"/>

  <!-- Top Head Foliage Sprouts -->
  <path d="M100 65 C85 30, 115 30, 100 65 Z" fill="url(#leafGreen)" filter="url(#natureGlow)"/>
  <path d="M85 70 C60 45, 80 35, 88 68 Z" fill="url(#leafGreen)"/>
  <path d="M115 70 C140 45, 120 35, 112 68 Z" fill="url(#leafGreen)"/>

  <!-- Head Wooden Knot -->
  <ellipse cx="100" cy="85" rx="32" ry="28" fill="url(#treantBark)"/>

  <!-- Little Head Flower -->
  <circle cx="118" cy="62" r="7" fill="url(#flowerPink)" filter="url(#natureGlow)"/>
  <circle cx="118" cy="62" r="2.5" fill="#fef08a"/>

  <!-- Amber/Green Big Cute Eyes -->
  <ellipse cx="86" cy="84" rx="7" ry="7" fill="#064e3b"/>
  <circle cx="88" cy="82" r="3" fill="#86efac"/><circle cx="89" cy="81" r="1.2" fill="#ffffff"/>

  <ellipse cx="114" cy="84" rx="7" ry="7" fill="#064e3b"/>
  <circle cx="112" cy="82" r="3" fill="#86efac"/><circle cx="113" cy="81" r="1.2" fill="#ffffff"/>

  <!-- Cute Wooden Smile -->
  <path d="M94 95 Q100 104 106 95" stroke="#064e3b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  

  

  

  
</svg>
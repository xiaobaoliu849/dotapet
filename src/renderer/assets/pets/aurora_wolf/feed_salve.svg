<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="wolfFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="wolfBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </radialGradient>
    <radialGradient id="salvePotion" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="salveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Red Vitality Sparkles (+400 HP Flask) -->
  <polygon points="35,45 38,52 45,55 38,58 35,65 32,58 25,55 32,52" fill="#f87171" filter="url(#salveGlow)"/>
  <polygon points="160,35 163,42 170,45 163,48 160,55 157,48 150,45 157,42" fill="#f87171" filter="url(#salveGlow)"/>
  <text x="140" y="75" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14" fill="#ef4444" filter="url(#salveGlow)">+400 HP</text>

  <!-- Tail -->
  <path d="M140 135 C175 125, 185 85, 160 70 C145 60, 140 90, 130 115 Z" fill="url(#wolfFur)"/>

  <!-- Hind Legs -->
  <ellipse cx="130" cy="150" rx="18" ry="14" fill="#bae6fd"/>
  <ellipse cx="140" cy="160" rx="10" ry="7" fill="#ffffff"/>

  <!-- Body -->
  <ellipse cx="105" cy="135" rx="35" ry="30" fill="url(#wolfFur)"/>
  <ellipse cx="100" cy="140" rx="22" ry="20" fill="url(#wolfBelly)"/>

  <!-- Front Paws (Holding Salve Flask) -->
  <ellipse cx="75" cy="150" rx="11" ry="8" fill="#ffffff"/>
  <ellipse cx="115" cy="150" rx="11" ry="8" fill="#ffffff"/>

  <!-- Ears -->
  <polygon points="65,75 50,30 85,55" fill="url(#wolfFur)"/>
  <polygon points="66,70 56,38 80,56" fill="#fbcfe8"/>
  <polygon points="125,75 140,30 105,55" fill="url(#wolfFur)"/>
  <polygon points="124,70 134,38 110,56" fill="#fbcfe8"/>

  <!-- Head (Tilted back drinking) -->
  <ellipse cx="95" cy="88" rx="36" ry="32" fill="url(#wolfFur)"/>
  <ellipse cx="95" cy="100" rx="20" ry="15" fill="url(#wolfBelly)"/>

  <!-- Blinking Satisfied Eyes -->
  <path d="M76 84 Q83 76 90 84" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M100 84 Q107 76 114 84" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- DOTA 2 Healing Salve Flask -->
  <!-- Flask Body (Green clay bottle with red potion inside) -->
  <path d="M85 110 C80 120, 80 140, 95 140 C110 140, 110 120, 105 110 Z" fill="#15803d" stroke="#166534" stroke-width="2"/>
  <ellipse cx="95" cy="125" rx="9" ry="10" fill="url(#salvePotion)" filter="url(#salveGlow)"/>
  <rect x="91" y="102" width="8" height="9" rx="2" fill="#a16207"/>

  <!-- Magic Droplets -->
  <circle cx="95" cy="98" r="2.5" fill="#f87171" filter="url(#salveGlow)"/>
</svg>

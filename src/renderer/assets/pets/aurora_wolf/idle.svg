<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="wolfFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="wolfBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </radialGradient>
    <radialGradient id="frostGem" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ice Flakes background floating -->
  <polygon points="35,35 38,42 45,45 38,48 35,55 32,48 25,45 32,42" fill="#bae6fd" opacity="0.8" filter="url(#iceGlow)"/>
  <polygon points="165,45 167,50 172,52 167,54 165,59 163,54 158,52 163,50" fill="#bae6fd" opacity="0.8" filter="url(#iceGlow)"/>

  <!-- Fluffy Wolf Tail (Wagging Idle) -->
  <path d="M140 135 C175 125, 185 85, 160 70 C145 60, 140 90, 130 115 Z" fill="url(#wolfFur)" filter="url(#iceGlow)"/>
  <path d="M160 70 C155 78, 148 85, 142 88" stroke="#0284c7" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Hind Legs -->
  <ellipse cx="130" cy="150" rx="18" ry="14" fill="#bae6fd"/>
  <ellipse cx="140" cy="160" rx="10" ry="7" fill="#ffffff"/>

  <!-- Body -->
  <ellipse cx="105" cy="135" rx="35" ry="30" fill="url(#wolfFur)"/>
  <!-- Belly -->
  <ellipse cx="100" cy="140" rx="22" ry="20" fill="url(#wolfBelly)"/>

  <!-- Front Paws -->
  <ellipse cx="80" cy="162" rx="10" ry="7" fill="#ffffff"/>
  <ellipse cx="105" cy="162" rx="10" ry="7" fill="#ffffff"/>

  <!-- Ears (Alert & Cute) -->
  <polygon points="65,75 50,30 85,55" fill="url(#wolfFur)"/>
  <polygon points="66,70 56,38 80,56" fill="#fbcfe8"/>
  <polygon points="125,75 140,30 105,55" fill="url(#wolfFur)"/>
  <polygon points="124,70 134,38 110,56" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="95" cy="90" rx="36" ry="32" fill="url(#wolfFur)"/>
  <ellipse cx="95" cy="102" rx="20" ry="15" fill="url(#wolfBelly)"/>

  <!-- Frost Arcana Gem Collar -->
  <path d="M72 118 Q95 132 118 118" stroke="#0284c7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="95,122 101,130 95,138 89,130" fill="url(#frostGem)" filter="url(#iceGlow)"/>

  <!-- Bright Blue Ice Eyes (Idle Looking) -->
  <ellipse cx="80" cy="85" rx="7" ry="6" fill="#ffffff"/>
  <circle cx="81" cy="85" r="4.5" fill="#0284c7"/>
  <circle cx="82.5" cy="83" r="1.8" fill="#ffffff"/>

  <ellipse cx="110" cy="85" rx="7" ry="6" fill="#ffffff"/>
  <circle cx="109" cy="85" r="4.5" fill="#0284c7"/>
  <circle cx="110.5" cy="83" r="1.8" fill="#ffffff"/>

  <!-- Cute Black Nose -->
  <ellipse cx="95" cy="98" rx="4.5" ry="3.5" fill="#0f172a"/>
  <!-- Smiling Mouth -->
  <path d="M91 103 Q95 106 99 103" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Pink Tongue -->
  <path d="M93 104 Q95 110 97 104 Z" fill="#f43f5e"/>
</svg>

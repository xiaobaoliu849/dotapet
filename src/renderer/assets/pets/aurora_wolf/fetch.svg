<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="wolfFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="wolfBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </radialGradient>
    <radialGradient id="snowballGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <filter id="iceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Speed Lines & Snow Dust -->
  <line x1="20" y1="120" x2="60" y2="120" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="15" y1="140" x2="50" y2="140" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <polygon points="30,95 33,100 38,102 33,104 30,109 27,104 22,102 27,100" fill="#bae6fd" filter="url(#iceGlow)"/>

  <!-- Tail (Dynamic in Leap) -->
  <path d="M45 105 C15 90, 20 55, 45 50 C55 48, 55 75, 55 95 Z" fill="url(#wolfFur)" filter="url(#iceGlow)"/>

  <!-- Body (Leaping Upwards Diagonally) -->
  <g transform="rotate(-18 100 110)">
    <!-- Hind Legs (Kicking Back) -->
    <ellipse cx="55" cy="140" rx="14" ry="9" fill="#bae6fd" transform="rotate(-35 55 140)"/>
    <ellipse cx="40" cy="155" rx="8" ry="5" fill="#ffffff"/>
    <ellipse cx="68" cy="135" rx="12" ry="8" fill="#7dd3fc"/>
    <ellipse cx="55" cy="150" rx="8" ry="5" fill="#ffffff"/>

    <!-- Torso -->
    <ellipse cx="100" cy="115" rx="36" ry="26" fill="url(#wolfFur)"/>
    <ellipse cx="105" cy="120" rx="22" ry="16" fill="url(#wolfBelly)"/>

    <!-- Front Paws (Reaching for snowball) -->
    <ellipse cx="140" cy="115" rx="11" ry="6" fill="#ffffff" transform="rotate(20 140 115)"/>
    <ellipse cx="155" cy="100" rx="10" ry="6" fill="#ffffff" transform="rotate(10 155 100)"/>

    <!-- Ears (Streamlined back) -->
    <polygon points="85,60 60,30 98,45" fill="url(#wolfFur)"/>
    <polygon points="86,56 68,35 94,47" fill="#fbcfe8"/>
    <polygon points="130,55 135,18 112,40" fill="url(#wolfFur)"/>
    <polygon points="128,52 131,24 115,42" fill="#fbcfe8"/>

    <!-- Head -->
    <ellipse cx="115" cy="75" rx="32" ry="28" fill="url(#wolfFur)"/>
    <ellipse cx="122" cy="85" rx="18" ry="13" fill="url(#wolfBelly)"/>

    <!-- Excited Big Catching Eyes -->
    <ellipse cx="110" cy="70" rx="7" ry="6" fill="#ffffff"/>
    <circle cx="112" cy="70" r="4.5" fill="#0284c7"/>
    <circle cx="113.5" cy="68" r="1.8" fill="#ffffff"/>

    <ellipse cx="132" cy="70" rx="7" ry="6" fill="#ffffff"/>
    <circle cx="134" cy="70" r="4.5" fill="#0284c7"/>
    <circle cx="135.5" cy="68" r="1.8" fill="#ffffff"/>

    <!-- Snout & Nose -->
    <ellipse cx="130" cy="82" rx="4" ry="3" fill="#0f172a"/>

    <!-- Open Jaws Catching Snowball -->
    <path d="M125 86 Q135 94 142 86" stroke="#0f172a" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Glowing Blue Ice Snowball in Air / Teeth -->
  <circle cx="152" cy="72" r="14" fill="url(#snowballGlow)" filter="url(#iceGlow)"/>
  <circle cx="147" cy="67" r="4" fill="#ffffff"/>
  <!-- Snow Flakes exploding from ball -->
  <polygon points="172,60 174,64 178,65 174,67 172,71 170,67 166,65 170,64" fill="#bae6fd" filter="url(#iceGlow)"/>
  <polygon points="155,45 157,48 160,49 157,51 155,54 153,51 150,49 153,48" fill="#bae6fd"/>
</svg>

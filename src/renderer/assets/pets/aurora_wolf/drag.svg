<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="wolfFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
    <radialGradient id="wolfBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </radialGradient>
    <radialGradient id="frostGem" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </defs>

  <!-- Struggling Tail in Air -->
  <path d="M90 150 C70 180, 100 195, 120 175 C130 165, 115 155, 105 145 Z" fill="url(#wolfFur)"/>

  <!-- Body (Hanging Stretched Vertically) -->
  <ellipse cx="100" cy="115" rx="30" ry="38" fill="url(#wolfFur)"/>
  <ellipse cx="100" cy="120" rx="18" ry="24" fill="url(#wolfBelly)"/>

  <!-- Dangling Flailing Hind Legs -->
  <ellipse cx="75" cy="165" rx="9" ry="14" fill="#bae6fd" transform="rotate(25 75 165)"/>
  <ellipse cx="70" cy="178" rx="8" ry="6" fill="#ffffff"/>
  <ellipse cx="125" cy="165" rx="9" ry="14" fill="#bae6fd" transform="rotate(-25 125 165)"/>
  <ellipse cx="130" cy="178" rx="8" ry="6" fill="#ffffff"/>

  <!-- Dangling Front Paws Splaying Out -->
  <ellipse cx="62" cy="120" rx="12" ry="7" fill="#ffffff" transform="rotate(-30 62 120)"/>
  <ellipse cx="138" cy="120" rx="12" ry="7" fill="#ffffff" transform="rotate(30 138 120)"/>

  <!-- Ears (Pushed Back / Shocked) -->
  <polygon points="65,65 35,35 75,48" fill="url(#wolfFur)"/>
  <polygon points="65,60 42,40 72,50" fill="#fbcfe8"/>
  <polygon points="135,65 165,35 125,48" fill="url(#wolfFur)"/>
  <polygon points="135,60 158,40 128,50" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="100" cy="72" rx="34" ry="28" fill="url(#wolfFur)"/>
  <ellipse cx="100" cy="80" rx="18" ry="13" fill="url(#wolfBelly)"/>

  <!-- Collar Pulled Slightly -->
  <path d="M78 95 Q100 106 122 95" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <polygon points="100,100 105,107 100,114 95,107" fill="url(#frostGem)"/>

  <!-- Big Surprised Round Eyes (O_O Surprised when picked up) -->
  <ellipse cx="85" cy="68" rx="8" ry="9" fill="#ffffff"/>
  <circle cx="85" cy="68" r="5" fill="#0284c7"/>
  <circle cx="86.5" cy="65" r="2.2" fill="#ffffff"/>

  <ellipse cx="115" cy="68" rx="8" ry="9" fill="#ffffff"/>
  <circle cx="115" cy="68" r="5" fill="#0284c7"/>
  <circle cx="116.5" cy="65" r="2.2" fill="#ffffff"/>

  <!-- Nose -->
  <ellipse cx="100" cy="78" rx="4" ry="3" fill="#0f172a"/>
  <!-- Open 'O' Shaped Surprised Mouth -->
  <ellipse cx="100" cy="86" rx="5" ry="6" fill="#0f172a"/>
  <ellipse cx="100" cy="88" rx="3" ry="3" fill="#f43f5e"/>

  <!-- Little Sweat Drop -->
  <path d="M142 55 C142 50, 146 45, 146 45 C146 45, 150 50, 150 55 C150 58, 146 60, 142 55 Z" fill="#38bdf8"/>
</svg>

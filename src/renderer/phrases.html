<!DOCTYPE html>
<html lang="zh-CN" data-settings-theme="green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>刀塔宠物 · 快捷短语</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="settings-theme.css" />
  <link rel="stylesheet" href="phrases-theme.css" />
  <script src="phrases-mode.js"></script>
  <style>
    /* The editor scrolls its rows while keeping actions available. */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .phrases-modal-card {
      max-height: none;
      height: 100%;
    }
    .phrases-modal-body { min-height: 0; }
    .phrases-modal-header, .phrases-modal-footer { flex-shrink: 0; }
    .phrases-modal-title, .preset-import-strip, .phrases-modal-footer, .footer-left, .footer-right { flex-wrap: wrap; }
    .phrases-table-header, .phrase-row-item { grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 176px; }
    .phrase-input, .preset-dropdown { min-width: 0; }
    .phrase-row-actions { justify-content: flex-end; }
    .phrases-usage-hint { margin: 0; line-height: 1.6; }
    @media (max-width: 700px) {
      .phrases-table-header { display: none; }
      .phrase-row-item { grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1fr); }
      .phrase-row-actions { grid-column: 2 / 4; }
    }
  </style>
</head>
<body>
  <!-- Same card structure as the legacy in-pet modal so all .phrases-* styles apply unchanged -->
  <div class="phrases-picker-modal no-drag interactive">
    <div class="phrases-modal-card">
      <div class="phrases-modal-header">
        <div class="phrases-modal-title">
          <span class="phrases-title-icon">⚡</span>
          <span class="phrases-title-text">快捷短语</span>
          <span class="phrases-title-badge">局内热键: Ctrl+1~0 (中文) / Alt+1~0 (英文)</span>
        </div>
      </div>

      <div class="phrases-modal-body">
        <p class="phrases-usage-hint">点「复制中文 / 英文」→ 切回 DOTA 2，按 Enter 打开聊天，再按 Ctrl+V 粘贴。已有双语短语可直接使用，无需 API 密钥。</p>
        <!-- Preset Template Importer Strip -->
        <div class="preset-import-strip">
          <span class="preset-label">💡 快速导入精简模板：</span>
          <select id="select-preset-template" class="preset-dropdown">
            <!-- Dynamically populated from SIMPLIFIED_PRESETS -->
          </select>
          <span class="preset-to-label">→ 第</span>
          <select id="select-preset-target-row" class="preset-row-dropdown">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="0">0</option>
          </select>
          <span class="preset-unit-label">行</span>
          <button id="btn-import-preset" class="btn-import-preset">⚡ 导入此条</button>
        </div>

        <!-- Table Header -->
        <div class="phrases-table-header">
          <div class="col-num">#</div>
          <div class="col-cn">🇨🇳 中文短语 (局内 Ctrl + 数字/0)</div>
          <div class="col-en">🇺🇸 英文短语 (局内 Alt + 数字/0)</div>
          <div class="col-actions">操作</div>
        </div>

        <!-- Phrases 10 Rows List -->
        <div class="phrases-rows-list" id="phrases-rows-container">
          <!-- Dynamically populated 10 rows -->
        </div>
      </div>

      <div class="phrases-modal-footer">
        <div class="footer-left">
          <button id="btn-translate-all-phrases" class="btn-secondary-action">⚡ AI 补全空白英文</button>
          <button id="btn-reset-default-phrases" class="btn-secondary-action btn-dim">🔄 恢复精简默认值</button>
        </div>
        <div class="footer-right">
          <span id="phrases-draft-status" role="status" aria-live="polite"></span>
          <button id="btn-save-phrases" class="btn-primary-action">💾 保存并生效</button>
          <button id="btn-cancel-phrases" class="btn-secondary-action">关闭 (ESC)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="hud-toast" class="toast hidden" role="status" aria-live="polite">已保存</div>

  <script src="phrases.js"></script>
</body>
</html>
